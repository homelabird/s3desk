name: Frontend E2E

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      browser_facing: ${{ steps.filter.outputs.browser_facing }}
      workflow_lint_scope: ${{ steps.filter.outputs.workflow_lint_scope }}
      frontend_bundle_runtime: ${{ steps.filter.outputs.frontend_bundle_runtime }}
      frontend_bundle_contract: ${{ steps.filter.outputs.frontend_bundle_contract }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect frontend and browser-surface change scope
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            browser_facing:
              - ".github/workflows/frontend-e2e.yml"
              - "compose/test/e2e.yml"
              - "compose/remote/**"
              - "deploy/caddy/**"
              - "k8s/s3desk-caddy.yaml"
              - "charts/s3desk/**"
              - "scripts/Caddyfile"
              - "scripts/compose.sh"
              - "scripts/run_live_e2e_local.sh"
              - "openapi.yml"
              - "frontend/index.html"
              - "frontend/package-lock.json"
              - "frontend/package.json"
              - "frontend/patches/**"
              - "frontend/playwright.config.ts"
              - "frontend/public/**"
              - "frontend/scripts/check-e2e-geometry-probes.mjs"
              - "frontend/src/**"
              - "frontend/tests/**"
              - "frontend/tsconfig*.json"
              - "frontend/vite.config.ts"
            workflow_lint_scope:
              - ".github/workflows/**"
              - "scripts/check_github_workflows.sh"
              - "scripts/check_github_workflows.py"
              - "scripts/install_actionlint.sh"
            frontend_bundle_runtime:
              - "openapi.yml"
              - "frontend/index.html"
              - "frontend/package-lock.json"
              - "frontend/package.json"
              - "frontend/patches/**"
              - "frontend/public/**"
              - "frontend/src/**"
              - "frontend/tsconfig*.json"
              - "frontend/vite.config.ts"
            frontend_bundle_contract:
              - ".github/workflows/frontend-e2e.yml"
              - "scripts/bundle_report.js"
              - "scripts/__tests__/bundle_report.test.js"
              - "frontend/scripts/bundle-budgets.json"
              - "frontend/scripts/run-bundle-budget.mjs"
              - "frontend/package.json"

  bundle-budget:
    name: Bundle Budget
    if: github.event_name != 'schedule' && (needs.changes.outputs.frontend_bundle_runtime == 'true' || needs.changes.outputs.frontend_bundle_contract == 'true')
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run bundle report contract test
        if: needs.changes.outputs.frontend_bundle_contract == 'true'
        run: npm run check:bundle-report

      - name: Run bundle budget check
        if: needs.changes.outputs.frontend_bundle_runtime == 'true'
        run: npm run bundle:budget

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-bundle-report
          path: |
            frontend/dist/build-analyze.log
            frontend/dist/bundle-report.md
            frontend/dist/stats.json
            frontend/dist/stats.html
          if-no-files-found: ignore

      - name: Write bundle budget summary
        if: always()
        run: |
          {
            report_path="dist/bundle-report.md"
            status_line="not applicable (no bundle-affecting runtime change)"
            contract_status="not applicable (no bundle manifest/report/summary wiring change)"
            review_targets=()
            warning_targets=()
            action_hints=()
            runtime_scope_active=0
            if [[ "${{ needs.changes.outputs.frontend_bundle_runtime }}" == "true" ]]; then
              runtime_scope_active=1
              status_line="executed"
            fi
            if [[ "${{ needs.changes.outputs.frontend_bundle_contract }}" == "true" ]]; then
              contract_status="executed via \`npm run check:bundle-report\`"
            fi
            if [[ ${runtime_scope_active} -eq 1 && -f "${report_path}" ]]; then
              mapfile -t warning_lines < <(awk '/^Budget warnings:/{flag=1;next} flag && /^- /{sub(/^- /, ""); print} flag && NF==0{flag=0}' "${report_path}")
              mapfile -t candidate_lines < <(awk '/^Budget review candidates:/{flag=1;next} flag && /^- /{sub(/^- /, ""); print} flag && NF==0{flag=0}' "${report_path}")
              mapfile -t action_lines < <(awk '/^Budget action hints:/{flag=1;next} flag && /^- /{sub(/^- /, ""); print} flag && NF==0{flag=0}' "${report_path}")
              if grep -Fq "No budget warnings." "${report_path}" && grep -Fq "No budget review candidates." "${report_path}"; then
                status_line="executed"
              elif [[ ${#warning_lines[@]} -gt 0 || ${#candidate_lines[@]} -gt 0 ]]; then
                status_line="executed; follow-up remains"
              fi
              for source in "${warning_lines[@]}"; do
                target="${source%%:*}"
                [[ -n "${target}" ]] || continue
                duplicate=0
                for existing in "${warning_targets[@]}"; do
                  if [[ "${existing}" == "${target}" ]]; then
                    duplicate=1
                    break
                  fi
                done
                if [[ ${duplicate} -eq 0 ]]; then
                  warning_targets+=("${target}")
                fi
                if [[ ${#warning_targets[@]} -ge 2 ]]; then
                  break
                fi
              done
              for source in "${candidate_lines[@]}" "${warning_lines[@]}"; do
                target="${source%%:*}"
                [[ -n "${target}" ]] || continue
                duplicate=0
                for existing in "${review_targets[@]}"; do
                  if [[ "${existing}" == "${target}" ]]; then
                    duplicate=1
                    break
                  fi
                done
                if [[ ${duplicate} -eq 0 ]]; then
                  review_targets+=("${target}")
                fi
                if [[ ${#review_targets[@]} -ge 2 ]]; then
                  break
                fi
              done
              for source in "${action_lines[@]}"; do
                target="${source%%:*}"
                action="${source#*: }"
                [[ -n "${target}" && -n "${action}" ]] || continue
                duplicate=0
                for existing in "${action_hints[@]}"; do
                  if [[ "${existing}" == "${target}: ${action}" ]]; then
                    duplicate=1
                    break
                  fi
                done
                if [[ ${duplicate} -eq 0 ]]; then
                  action_hints+=("${target}: ${action}")
                fi
                if [[ ${#action_hints[@]} -ge 2 ]]; then
                  break
                fi
              done
            fi
            echo "## Bundle Budget"
            echo ""
            echo "- Bundle Budget: ${status_line}."
            echo "- Bundle Budget Contract: ${contract_status}."
            if [[ ${runtime_scope_active} -eq 0 ]]; then
              echo "- Warnings: not applicable (no bundle-affecting runtime change)."
            elif [[ ${#warning_targets[@]} -gt 0 ]]; then
              {
                printf -- "- Warnings:"
                for target in "${warning_targets[@]}"; do
                  printf -- " \`%s\`" "${target}"
                done
                printf -- ".\n"
              }
            else
              echo "- Warnings: none."
            fi
            echo "- Lane role: frontend bundle-size regression signal for bundle-affecting changes."
            echo "- Local equivalent: \`cd frontend && npm run bundle:budget\`"
            echo "- CI command: \`npm run bundle:budget\`"
            if [[ ${runtime_scope_active} -eq 1 ]]; then
              echo "- Artifact: \`frontend-bundle-report\`"
            else
              echo "- Artifact: not applicable (no bundle-affecting runtime change)."
            fi
            if [[ ${runtime_scope_active} -eq 0 ]]; then
              echo "- Review targets: not applicable (no bundle-affecting runtime change)."
            elif [[ ${#review_targets[@]} -gt 0 ]]; then
              {
                printf -- "- Review targets:"
                for target in "${review_targets[@]}"; do
                  printf -- " \`%s\`" "${target}"
                done
                printf -- " (open \`frontend-bundle-report\` for the full markdown + stats bundle).\n"
              }
            else
              echo "- Review targets: none."
              echo "- Artifact review: open \`frontend-bundle-report\` when you need the full markdown + stats bundle."
            fi
            if [[ ${runtime_scope_active} -eq 0 ]]; then
              echo "- Action hints: not applicable (no bundle-affecting runtime change)."
            elif [[ ${#action_hints[@]} -gt 0 ]]; then
              {
                printf -- "- Action hints:"
                for hint in "${action_hints[@]}"; do
                  target="${hint%%:*}"
                  action="${hint#*: }"
                  printf -- " \`%s\` (%s)" "${target}" "${action}"
                done
                printf -- ".\n"
              }
            else
              echo "- Action hints: none."
            fi
            echo "- Branch protection: normally advisory, not a default required check."
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: Workflow Lint
    if: github.event_name != 'schedule'
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: needs.changes.outputs.workflow_lint_scope == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        if: needs.changes.outputs.workflow_lint_scope == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            backend/go.sum
            scripts/install_actionlint.sh

      - name: Skip workflow lint when workflow wiring is out of scope
        if: needs.changes.outputs.workflow_lint_scope != 'true'
        run: |
          echo "No workflow changes detected."
          echo "Workflow lint passes without running because workflow wiring is unchanged."

      - name: Install repo-local actionlint
        if: needs.changes.outputs.workflow_lint_scope == 'true'
        shell: bash
        run: bash ./scripts/install_actionlint.sh

      - name: Install workflow validator Python dependency
        if: needs.changes.outputs.workflow_lint_scope == 'true'
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Run workflow lint
        if: needs.changes.outputs.workflow_lint_scope == 'true'
        shell: bash
        run: bash ./scripts/check_github_workflows.sh

      - name: Write workflow lint summary
        if: always()
        run: |
          {
            echo "## Workflow Lint"
            echo ""
            if [[ "${{ needs.changes.outputs.workflow_lint_scope }}" != "true" ]]; then
              echo "- Workflow Lint: not applicable (workflow wiring is unchanged)."
              if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
                echo "- Browser Lanes: not applicable (the browser surface is out of scope)."
              fi
            else
              echo "- Workflow Lint: executed."
              echo "- Tool install: \`bash ./scripts/install_actionlint.sh\` (module/build cache keyed to the installer)."
              echo "- Lint command: \`bash ./scripts/check_github_workflows.sh\`"
              echo "- Purpose: validate GitHub workflow wiring before browser lanes execute."
              if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
                echo "- Browser Lanes: not applicable (workflow or browser-CI wiring changed, but the browser surface did not)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mock-e2e-smoke:
    name: Core Mock E2E Smoke
    if: github.event_name != 'schedule'
    needs:
      - changes
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        if: needs.changes.outputs.browser_facing == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Skip core mock suite when the browser surface is out of scope
        if: needs.changes.outputs.browser_facing != 'true'
        run: |
          echo "Browser surface is out of scope."
          echo "Required check passes without running the mock Playwright suite."

      - name: Install frontend dependencies
        if: needs.changes.outputs.browser_facing == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium for desktop and mobile projects
        if: needs.changes.outputs.browser_facing == 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Enforce E2E geometry guard
        if: needs.changes.outputs.browser_facing == 'true'
        run: npm run check:e2e:geometry

      - name: Run check-smoke boot gates
        if: needs.changes.outputs.browser_facing == 'true'
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-check-smoke
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-check-smoke
        run: npm run test:e2e:smoke

      - name: Upload check-smoke Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-check-smoke-results
          path: frontend/test-results-check-smoke
          if-no-files-found: ignore

      - name: Write check-smoke summary
        if: always()
        run: |
          {
            echo "## Core Mock E2E Smoke"
            echo ""
            if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
              if [[ "${{ needs.changes.outputs.workflow_lint_scope }}" == "true" ]]; then
                echo "- Browser Lanes: smoke not applicable (workflow or browser-CI wiring changed, but the browser surface did not)."
              else
                echo "- Browser Lanes: smoke not applicable (the browser surface is out of scope)."
              fi
              echo "- Required checks still report success when the change scope is outside the frontend browser surface."
            else
              echo "- Browser Lanes: smoke executed."
              echo "- Geometry guard: \`npm run check:e2e:geometry\` runs before Playwright suites."
              echo "- Boot-gate command: \`npm run test:e2e:smoke\`"
              echo "- Check-smoke artifact: \`playwright-check-smoke-results\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mock-e2e-shard:
    name: Core Mock E2E Shard ${{ matrix.shard }}
    if: github.event_name != 'schedule' && needs.changes.outputs.browser_facing == 'true'
    needs:
      - changes
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/3"
            artifact_suffix: shard-1
          - shard: "2/3"
            artifact_suffix: shard-2
          - shard: "3/3"
            artifact_suffix: shard-3
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium for desktop and mobile projects
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run core mock Playwright suite excluding check-smoke and dedicated mobile responsive specs
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-core-${{ matrix.artifact_suffix }}
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-core-${{ matrix.artifact_suffix }}
          PLAYWRIGHT_TEST_TIMEOUT_MS: "60000"
          PLAYWRIGHT_EXPECT_TIMEOUT_MS: "15000"
        run: npm run test:e2e:core -- --workers=2 --shard=${{ matrix.shard }}

      - name: Upload core mock Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-core-mock-results-${{ matrix.artifact_suffix }}
          path: frontend/test-results-core-${{ matrix.artifact_suffix }}
          if-no-files-found: ignore

  mock-e2e:
    name: Core Mock E2E
    if: always() && github.event_name != 'schedule'
    needs:
      - changes
      - workflow-lint
      - mock-e2e-smoke
      - mock-e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write core mock summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Core Mock E2E"
            echo ""
            if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
              if [[ "${{ needs.changes.outputs.workflow_lint_scope }}" == "true" ]]; then
                echo "- Browser Lanes: smoke + core not applicable (workflow or browser-CI wiring changed, but the browser surface did not)."
              else
                echo "- Browser Lanes: smoke + core not applicable (the browser surface is out of scope)."
              fi
              echo "- Required checks still report success when the change scope is outside the frontend browser surface."
            else
              echo "- Browser Lanes: smoke + core shards executed."
              echo "- Lane role: browser-facing boot gates plus desktop/mock regression coverage."
              echo "- Workflow lint prerequisite: see the separate \`Workflow Lint\` job."
              echo "- Geometry guard: \`npm run check:e2e:geometry\` runs in the smoke lane while core shards run independently."
              echo "- Boot-gate command: \`npm run test:e2e:smoke\`"
              echo "- Boot-gate scope: login/settings bootstrap and objects route boot."
              echo "- Core regression command: \`npm run test:e2e:core -- --workers=2 --shard=<index>/3\`"
              echo "- Core regression scope: excludes \`@check-smoke\`, \`@mobile-responsive\`, \`@demo\`, \`@perf\`, and \`@visual\`."
              echo "- Check-smoke artifact: \`playwright-check-smoke-results\`"
              echo "- Core artifacts: \`playwright-core-mock-results-shard-1\`, \`playwright-core-mock-results-shard-2\`, \`playwright-core-mock-results-shard-3\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          changes_result="${{ needs.changes.result }}"
          workflow_lint_result="${{ needs['workflow-lint'].result }}"
          smoke_result="${{ needs['mock-e2e-smoke'].result }}"
          shard_result="${{ needs['mock-e2e-shard'].result }}"

          if [[ "${changes_result}" != "success" ]]; then
            echo "changes job did not complete successfully: ${changes_result}" >&2
            exit 1
          fi
          if [[ "${workflow_lint_result}" != "success" ]]; then
            echo "workflow lint did not complete successfully: ${workflow_lint_result}" >&2
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
            exit 0
          fi
          if [[ "${smoke_result}" != "success" ]]; then
            echo "core mock smoke did not complete successfully: ${smoke_result}" >&2
            exit 1
          fi
          if [[ "${shard_result}" != "success" ]]; then
            echo "core mock shard suite did not complete successfully: ${shard_result}" >&2
            exit 1
          fi

  visual-regression-e2e:
    name: Visual Regression E2E
    if: github.event_name != 'schedule'
    needs:
      - changes
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_HTML_REPORT: "1"
      PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-visual
      PLAYWRIGHT_OUTPUT_DIR: test-results-visual
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        if: needs.changes.outputs.browser_facing == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Skip visual regression suite when the browser surface is out of scope
        if: needs.changes.outputs.browser_facing != 'true'
        run: |
          echo "Browser surface is out of scope."
          echo "Visual regression check passes without running screenshot assertions."

      - name: Install frontend dependencies
        if: needs.changes.outputs.browser_facing == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium for visual regression
        if: needs.changes.outputs.browser_facing == 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Enforce E2E geometry guard
        if: needs.changes.outputs.browser_facing == 'true'
        run: npm run check:e2e:geometry

      - name: Run visual regression Playwright suite
        if: needs.changes.outputs.browser_facing == 'true'
        run: npm run test:e2e:visual

      - name: Upload visual regression HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-e2e-html-report
          path: frontend/playwright-report-visual
          if-no-files-found: ignore

      - name: Upload visual regression Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-e2e-test-results
          path: frontend/test-results-visual
          if-no-files-found: ignore

      - name: Write visual regression summary
        if: always()
        run: |
          {
            echo "## Visual Regression E2E"
            echo ""
            if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
              if [[ "${{ needs.changes.outputs.workflow_lint_scope }}" == "true" ]]; then
                echo "- Browser Lanes: visual not applicable (workflow or browser-CI wiring changed, but the browser surface did not)."
              else
                echo "- Browser Lanes: visual not applicable (the browser surface is out of scope)."
              fi
              echo "- Required checks still report success when the change scope is outside the frontend browser surface."
            else
              echo "- Browser Lanes: visual executed."
              echo "- Lane role: screenshot baselines for visual-regression specs and dark-theme visual coverage."
              echo "- Workflow lint prerequisite: see the separate \`Workflow Lint\` job."
              echo "- Geometry guard: \`npm run check:e2e:geometry\` runs before the visual suite."
              echo "- Local/CI command: \`npm run test:e2e:visual\`"
              echo "- HTML report artifact: \`visual-regression-e2e-html-report\`"
              echo "- Raw test results artifact: \`visual-regression-e2e-test-results\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mobile-responsive-e2e-project:
    name: Mobile Responsive E2E ${{ matrix.project }}
    if: github.event_name != 'schedule' && needs.changes.outputs.browser_facing == 'true'
    needs:
      - changes
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-iphone-13
            artifact_suffix: iphone-13
          - project: mobile-pixel-7
            artifact_suffix: pixel-7
    env:
      PLAYWRIGHT_HTML_REPORT: "1"
      PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-mobile-responsive-${{ matrix.artifact_suffix }}
      PLAYWRIGHT_OUTPUT_DIR: test-results-mobile-responsive-${{ matrix.artifact_suffix }}
      PLAYWRIGHT_TEST_TIMEOUT_MS: "60000"
      PLAYWRIGHT_EXPECT_TIMEOUT_MS: "10000"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium for mobile responsive projects
        run: npx playwright install --with-deps --only-shell chromium

      - name: Enforce E2E geometry guard
        run: npm run check:e2e:geometry

      - name: Run mobile responsive Playwright project
        run: npx playwright test --grep @mobile-responsive --project=${{ matrix.project }} --workers=2

      - name: Upload mobile responsive HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-responsive-e2e-html-report-${{ matrix.artifact_suffix }}
          path: frontend/playwright-report-mobile-responsive-${{ matrix.artifact_suffix }}
          if-no-files-found: ignore

      - name: Upload mobile responsive Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-responsive-e2e-test-results-${{ matrix.artifact_suffix }}
          path: frontend/test-results-mobile-responsive-${{ matrix.artifact_suffix }}
          if-no-files-found: ignore

  mobile-responsive-e2e:
    name: Mobile Responsive E2E (Required)
    if: always() && github.event_name != 'schedule'
    needs:
      - changes
      - workflow-lint
      - mobile-responsive-e2e-project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write mobile responsive summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobile Responsive E2E"
            echo ""
            if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
              if [[ "${{ needs.changes.outputs.workflow_lint_scope }}" == "true" ]]; then
                echo "- Browser Lanes: mobile-responsive not applicable (workflow or browser-CI wiring changed, but the browser surface did not)."
              else
                echo "- Browser Lanes: mobile-responsive not applicable (the browser surface is out of scope)."
              fi
              echo "- Required checks still report success when the change scope is outside the frontend browser surface."
            else
              echo "- Browser Lanes: mobile-responsive device projects executed."
              echo "- Required check: \`Mobile Responsive E2E (Required)\`"
              echo "- Lane role: required mobile task-completion coverage for drawers, sheets, cards, tabs, filters, and touch flows."
              echo "- Workflow lint prerequisite: see the separate \`Workflow Lint\` job."
              echo "- Device projects: \`mobile-iphone-13\` and \`mobile-pixel-7\` run in parallel."
              echo "- Geometry guard: \`npm run check:e2e:geometry\` runs before each mobile project."
              echo "- Local/CI command: \`npm run test:e2e:mobile-responsive\`"
              echo "- HTML report artifacts: \`mobile-responsive-e2e-html-report-iphone-13\`, \`mobile-responsive-e2e-html-report-pixel-7\`"
              echo "- Raw result artifacts: \`mobile-responsive-e2e-test-results-iphone-13\`, \`mobile-responsive-e2e-test-results-pixel-7\`"
              echo "- Targeted Settings/Login command: \`npm run test:e2e:mobile-responsive:settings-login\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          changes_result="${{ needs.changes.result }}"
          workflow_lint_result="${{ needs['workflow-lint'].result }}"
          project_result="${{ needs['mobile-responsive-e2e-project'].result }}"

          if [[ "${changes_result}" != "success" ]]; then
            echo "changes job did not complete successfully: ${changes_result}" >&2
            exit 1
          fi
          if [[ "${workflow_lint_result}" != "success" ]]; then
            echo "workflow lint did not complete successfully: ${workflow_lint_result}" >&2
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.browser_facing }}" != "true" ]]; then
            exit 0
          fi
          if [[ "${project_result}" != "success" ]]; then
            echo "mobile responsive device projects did not complete successfully: ${project_result}" >&2
            exit 1
          fi

  live-e2e-critical:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRITICAL_LIVE_TESTS: tests/api-crud.spec.ts tests/objects-live-flow.spec.ts tests/jobs-live-flow.spec.ts tests/transfers-live-fallback.spec.ts tests/bucket-policy-live.spec.ts tests/docs-smoke.spec.ts tests/server-migration-live.spec.ts tests/uploads-folder-live.spec.ts tests/objects-image-preview-live.spec.ts
      E2E_API_TOKEN: s3desk-e2e-token-0123456789abcdef012345
      E2E_ENCRYPTION_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      E2E_S3_ENDPOINT: http://minio:9000
      E2E_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      E2E_S3_REGION: us-east-1
      E2E_S3_ACCESS_KEY: minioadmin
      E2E_S3_SECRET_KEY: minioadmin
      E2E_S3_FORCE_PATH_STYLE: "true"
      E2E_S3_TLS_SKIP_VERIFY: "false"
      E2E_GCS_ENDPOINT: http://fake-gcs-server:4443/storage/v1/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      DOCS_BASE_URL: http://127.0.0.1:8080
      S3DESK_IMAGE: s3desk-e2e:ci
      MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:3.33.0
      FAKE_GCS_IMAGE: fsouza/fake-gcs-server:1.47.7
      S3DESK_COMPOSE_PROVIDER: docker
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build local S3Desk image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Containerfile.local
          load: true
          tags: ${{ env.S3DESK_IMAGE }}
          cache-from: type=gha,scope=live-e2e
          cache-to: type=gha,mode=max,scope=live-e2e

      - name: Start live E2E stack
        run: ./scripts/compose.sh e2e up -d minio azurite fake-gcs-server s3desk

      - name: Wait for backend health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "${PLAYWRIGHT_BASE_URL}/healthz" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "backend health check failed" >&2
          exit 1

      - name: Run nightly live Playwright suite
        working-directory: frontend
        env:
          E2E_LIVE: "1"
        run: |
          read -r -a critical_live_tests <<< "${CRITICAL_LIVE_TESTS}"
          npx playwright test "${critical_live_tests[@]}" --project=chromium

      - name: Capture live E2E stack logs
        if: always()
        run: |
          mkdir -p artifacts
          ./scripts/compose.sh e2e logs --no-color > artifacts/live-e2e-compose.log

      - name: Upload live Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-live-results
          path: |
            artifacts/live-e2e-compose.log
            frontend/test-results
          if-no-files-found: ignore

      - name: Stop live E2E stack
        if: always()
        run: ./scripts/compose.sh e2e down -v
