name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: backend/go.sum

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install repo-local actionlint
        shell: bash
        run: bash ./scripts/install_actionlint.sh

      - name: Install workflow validator Python dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Install backend security helper tools
        shell: bash
        run: bash ./scripts/install_backend_security_tools.sh

      - name: Install frontend dependencies for Playwright browser setup
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium for release-gate browser smoke
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full repository check gate
        shell: bash
        run: ./scripts/check.sh

      - name: Write release gate summary
        if: always()
        run: |
          {
            echo "## Release Gate"
            echo ""
            echo "- Main command: \`./scripts/check.sh\`"
            echo "- Workflow Lint: executed via repo-local \`actionlint\` installed by \`bash ./scripts/install_actionlint.sh\`."
            echo "- Browser Lanes: smoke executed inside \`./scripts/check.sh\`; \`core\` and \`mobile-responsive\` remain separate checks in \`Frontend E2E\`."
            echo "- Browser Guardrails: \`npm run check:e2e:geometry\` then \`npm run test:e2e:smoke\` run inside the full gate."
            echo "- Bundle Budget: separate advisory signal in \`Frontend E2E\`."
            echo "- Bundle Budget Contract: separate advisory signal in \`Frontend E2E\` via \`npm run check:bundle-report\`."
            echo "- Local bundle equivalent when relevant: \`cd frontend && npm run bundle:budget\`"
            echo "- Local contract equivalent when relevant: \`cd frontend && npm run check:bundle-report\`"
            echo "- Policy references: \`docs/TESTING.md\`, \`docs/RELEASE_GATE.md\`, and \`frontend/docs/MOBILE_RESPONSIVE_E2E.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
