name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            backend/go.sum
            scripts/install_actionlint.sh
            scripts/install_backend_security_tools.sh

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install repo-local actionlint
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: bash ./scripts/install_actionlint.sh

      - name: Install workflow validator Python dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Install backend security helper tools
        shell: bash
        run: bash ./scripts/install_backend_security_tools.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run repository CI gate
        shell: bash
        env:
          CHECK_FRONTEND_DEPS_READY: "1"
          CHECK_WORKFLOW_LINT_DELEGATED: ${{ github.event_name != 'workflow_dispatch' && '1' || '0' }}
        run: ./scripts/check.sh ci

      - name: Write release gate summary
        if: always()
        run: |
          {
            echo "## Release Gate"
            echo ""
            echo "- Main command: \`./scripts/check.sh ci\`"
            echo "- Workflow Lint: delegated to the \`Core Mock E2E\` prerequisite on pull requests and pushes; manual dispatch executes repo-local \`actionlint\`."
            echo "- Backend Security Tools: setup-go reuses module/build outputs keyed to the pinned \`staticcheck\`, \`gosec\`, and \`govulncheck\` installer."
            echo "- Browser Lanes: delegated to the required \`Core Mock E2E\` and \`Mobile Responsive E2E (Required)\` checks."
            echo "- Browser Guardrails: the required \`Core Mock E2E\` aggregate fails when its smoke prerequisite fails."
            echo "- Bundle Budget: separate advisory signal in \`Frontend E2E\`."
            echo "- Bundle Budget Contract: separate advisory signal in \`Frontend E2E\` via \`npm run check:bundle-report\`."
            echo "- Local bundle equivalent when relevant: \`cd frontend && npm run bundle:budget\`"
            echo "- Local contract equivalent when relevant: \`cd frontend && npm run check:bundle-report\`"
            echo "- Policy references: \`docs/TESTING.md\`, \`docs/RELEASE_GATE.md\`, and \`frontend/docs/MOBILE_RESPONSIVE_E2E.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
