{{- if .Values.monitoring.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "s3desk.fullname" . }}
  labels:
    {{- include "s3desk.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ include "s3desk.fullname" . }}
      rules:
        - alert: S3DeskTargetDown
          expr: |
            (up{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}} == 0)
            or absent(up{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: S3Desk metrics target is down
            description: The S3Desk metrics target has been missing or unreachable for five minutes.
        - alert: S3DeskJobQueueFull
          expr: |
            jobs_queue_capacity{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}} > 0
            and jobs_queue_depth{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}} >= jobs_queue_capacity{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: S3Desk job queue is full
            description: The in-process job queue has remained at capacity for five minutes.
        - alert: S3DeskMaintenanceCleanupError
          expr: |
            increase(maintenance_cleanup_total{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }},outcome="error"}[30m]) > 0
          labels:
            severity: warning
          annotations:
            summary: S3Desk maintenance cleanup failed
            description: A retention or orphan cleanup operation failed during the last thirty minutes.
        - alert: S3DeskObjectListFallbackScanHigh
          expr: |
            increase(storage_rclone_list_entries_scanned_total{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }},operation="list_objects_continuation"}[10m]) >= 100000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: S3Desk object listing is replaying many entries
            description: A provider continuation listing enumerated at least 100000 fallback entries in ten minutes; check whether native pagination is disabled and narrow the prefix if needed.
        - alert: S3DeskObjectIndexScanHigh
          expr: |
            sum by (provider) (
              increase(storage_rclone_list_entries_scanned_total{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }},operation="object_index"}[15m])
            ) >= 100000
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: S3Desk indexed at least 100000 objects in fifteen minutes
            description: Object-index scans reached the default per-job object limit over fifteen minutes. This alert reports scan volume; it does not stop provider requests or imply a billing hard cap.
        - alert: S3DeskObjectListPageErrors
          expr: |
            (
              sum by (provider) (increase(storage_list_page_requests_total{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }},status="error"}[10m]))
              /
              sum by (provider) (increase(storage_list_page_requests_total{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}}[10m]))
            ) > 0.05
            and sum by (provider) (increase(storage_list_page_requests_total{namespace={{ .Release.Namespace | quote }},job=~{{ printf "(.*/)?%s(/.*)?" (include "s3desk.fullname" .) | quote }}}[10m])) >= 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: S3Desk object-list page errors are elevated
            description: More than five percent of at least twenty provider page requests failed during the last ten minutes.
{{- end }}
