# Optional: grant a dedicated GitLab runner service account the privileges needed
# by helm_k8s_* CI smoke jobs. Configure the GitLab Runner Kubernetes executor
# for those jobs to use serviceAccountName: gitlab-runner-helm-smoke; do not bind
# these privileges to the namespace default service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-helm-smoke
  namespace: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-namespace-admin
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-runner-namespace-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-namespace-admin
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-helm-smoke
    namespace: gitlab-runner
---
# Required for helm_k8s_* jobs: allow managing namespaced release resources in
# dynamically created smoke-test namespaces.
# trivy:ignore:KSV053 CI smoke tests need exec/port-forward for validation.
# trivy:ignore:KSV056 CI smoke tests need to create services for helm release.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-helm-smoke
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/portforward
      - pods/exec
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-runner-helm-smoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-helm-smoke
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-helm-smoke
    namespace: gitlab-runner
