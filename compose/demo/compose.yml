# Single-node, authenticated SeaweedFS demo. All local S3 fixtures use this storage engine.
x-demo-storage-environment: &demo-storage-environment
  SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-demo-seaweedfs}
  SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-demo-seaweedfs-secret}
  SEAWEEDFS_REGION: ${SEAWEEDFS_REGION:-us-east-1}
  SEAWEEDFS_INTERNAL_ENDPOINT: ${SEAWEEDFS_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
  SEAWEEDFS_PUBLIC_ENDPOINT: "${SEAWEEDFS_PUBLIC_ENDPOINT:-http://${DEMO_PUBLIC_HOST:-127.0.0.1}:${SEAWEEDFS_API_PORT:-8333}}"
  DEMO_BUCKET: ${DEMO_BUCKET:-demo-bucket}
  DEMO_SEED_ATTEMPTS: ${DEMO_SEED_ATTEMPTS:-30}

services:
  seaweedfs:
    # Pin the server; keep the registry explicit for Podman.
    image: "${SEAWEEDFS_IMAGE:-docker.io/chrislusf/seaweedfs:4.47}"
    command:
      - server
      - -dir=/data
      # Master, volume and filer are private even on the Compose network.
      # Only the authenticated S3 gateway binds on the container interface.
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.port=9333
      - -master.volumeSizeLimitMB=256
      - -master.telemetry=false
      - -volume.port=9340
      - -volume.max=0
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.autoCreateBucket=false
      - "-s3.allowedOrigins=${DEMO_S3_ALLOWED_ORIGINS:-${DEMO_EXTERNAL_BASE_URL:-http://${DEMO_PUBLIC_HOST:-127.0.0.1}:${S3DESK_PORT:-8080}}}"
    environment:
      # SeaweedFS loads these as a static authenticated S3 identity.
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-demo-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-demo-seaweedfs-secret}
    ports:
      - "${SEAWEEDFS_BIND_HOST:-${S3DESK_BIND_HOST:-127.0.0.1}}:${SEAWEEDFS_API_PORT:-8333}:8333"
    volumes:
      - seaweedfs-demo-data:/data
      - ./filer.toml:/etc/seaweedfs/filer.toml:ro,z
    healthcheck:
      # The storage seeder additionally verifies signed S3 requests before use.
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -T 3 -O /dev/null http://127.0.0.1:8888/"]
      interval: 3s
      timeout: 8s
      retries: 40
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  seaweedfs-seed:
    image: "docker.io/rclone/rclone:${RCLONE_VERSION:-1.72.0}"
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/seed-seaweedfs.sh"]
    environment:
      <<: *demo-storage-environment
    volumes:
      - ../../scripts/demo/seed-seaweedfs.sh:/seed-seaweedfs.sh:ro,z
    restart: "no"

  s3desk:
    build:
      context: ../..
      dockerfile: Containerfile.local
      args:
        DB_BACKEND: sqlite
        RCLONE_VERSION: ${RCLONE_VERSION:-1.72.0}
    image: "${S3DESK_DEMO_IMAGE:-localhost/s3desk-demo:sqlite}"
    depends_on:
      seaweedfs-seed:
        condition: service_completed_successfully
    ports:
      - "${S3DESK_BIND_HOST:-127.0.0.1}:${S3DESK_PORT:-8080}:8080"
    environment:
      DEMO_PUBLIC_HOST: ${DEMO_PUBLIC_HOST:-127.0.0.1}
      # Exact browser-only URL opt-in for localhost demos. Does not allow backend
      # requests to loopback or disable the server's SSRF protection.
      S3DESK_ALLOWED_LOOPBACK_PUBLIC_ENDPOINT: "${SEAWEEDFS_PUBLIC_ENDPOINT:-http://${DEMO_PUBLIC_HOST:-127.0.0.1}:${SEAWEEDFS_API_PORT:-8333}}"
      ADDR: "0.0.0.0:8080"
      # Container-to-container seed traffic also requires ALLOW_REMOTE=true.
      # Host publication remains loopback-only unless explicitly changed.
      ALLOW_REMOTE: "${DEMO_ALLOW_REMOTE:-true}"
      ALLOWED_HOSTS: "${DEMO_ALLOWED_HOSTS:-127.0.0.1,localhost,::1},${DEMO_PUBLIC_HOST:-127.0.0.1},s3desk"
      API_TOKEN: ${API_TOKEN:-s3desk-demo-local-only-token-0123456789abcdef012345}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=}
      EXTERNAL_BASE_URL: "${DEMO_EXTERNAL_BASE_URL:-http://${DEMO_PUBLIC_HOST:-127.0.0.1}:${S3DESK_PORT:-8080}}"
      DB_BACKEND: "sqlite"
      DATA_DIR: "/data"
      THUMBNAIL_CACHE_TTL: "${THUMBNAIL_CACHE_TTL:-24h}"
      ALLOWED_LOCAL_DIRS: "${ALLOWED_LOCAL_DIRS:-/tmp}"
      JOB_QUEUE_CAPACITY: "20"
      S3_NATIVE_LIST: "${S3_NATIVE_LIST:-true}"
      UPLOAD_PROXY_ONLY: "${UPLOAD_PROXY_ONLY:-true}"
      S3_NATIVE_DOWNLOAD: "${S3_NATIVE_DOWNLOAD:-true}"
      DOWNLOAD_MAX_CONCURRENT_REQUESTS: "${DOWNLOAD_MAX_CONCURRENT_REQUESTS:-8}"
      DOWNLOAD_MAX_CONCURRENT_PER_PROFILE: "${DOWNLOAD_MAX_CONCURRENT_PER_PROFILE:-4}"
      RCLONE_RETRY_ATTEMPTS: "3"
      RCLONE_RETRY_BASE_DELAY: "800ms"
      RCLONE_RETRY_MAX_DELAY: "8s"
      RCLONE_RETRY_JITTER_RATIO: "0.2"
    volumes:
      # Keep the existing application DB, profiles, jobs and encryption state.
      - s3desk-demo-data:/data
    restart: unless-stopped

  s3desk-seed:
    image: "${PYTHON_IMAGE:-docker.io/library/python:3.12-alpine}"
    depends_on:
      s3desk:
        condition: service_started
      seaweedfs-seed:
        condition: service_completed_successfully
    entrypoint: ["python3", "/seed-s3desk.py"]
    environment:
      <<: *demo-storage-environment
      DEMO_PUBLIC_HOST: ${DEMO_PUBLIC_HOST:-127.0.0.1}
      API_TOKEN: ${API_TOKEN:-s3desk-demo-local-only-token-0123456789abcdef012345}
      S3DESK_API_BASE: ${S3DESK_API_BASE:-http://s3desk:8080}
      DEMO_PROFILE_NAME: ${DEMO_PROFILE_NAME:-SeaweedFS Demo}
      DEMO_SEED_TIMEOUT_SECONDS: ${DEMO_SEED_TIMEOUT_SECONDS:-180}
    volumes:
      - ../../scripts/demo/seed-s3desk.py:/seed-s3desk.py:ro,z
    restart: "no"

volumes:
  # Dedicated object-storage data; never reuse another engine's volume.
  seaweedfs-demo-data:
  s3desk-demo-data:
