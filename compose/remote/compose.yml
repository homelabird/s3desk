# Hardened remote/Postgres deployment template.
# For local development, use docker-compose.local-build.yml instead.
services:
  postgres:
    image: "${POSTGRES_IMAGE:-docker.io/library/postgres:15-alpine}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s3desk}
      POSTGRES_USER: ${POSTGRES_USER:-s3desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for remote deployment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - s3desk-postgres:/var/lib/postgresql/data

  s3desk:
    image: "${S3DESK_IMAGE:?set S3DESK_IMAGE}:${S3DESK_TAG:?set S3DESK_TAG}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${S3DESK_BIND_ADDRESS:-127.0.0.1}:${S3DESK_PORT:-8080}:8080"
    environment:
      ADDR: "0.0.0.0:8080"
      ALLOW_REMOTE: "true"
      LOG_ENV: "${LOG_ENV:-production}"
      API_TOKEN: "${API_TOKEN:?set API_TOKEN for remote deployment}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY for remote deployment}"
      ALLOWED_LOCAL_DIRS: "${ALLOWED_LOCAL_DIRS:?set ALLOWED_LOCAL_DIRS to one or more container paths S3Desk may access}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?set ALLOWED_HOSTS to allowed hostnames for remote deployment}"
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:-}"
      THUMBNAIL_CACHE_TTL: "${THUMBNAIL_CACHE_TTL:-24h}"
      DB_BACKEND: "postgres"
      DATABASE_URL: "postgres://${POSTGRES_USER:-s3desk}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for remote deployment}@postgres:5432/${POSTGRES_DB:-s3desk}?sslmode=disable"
      UPLOAD_PROXY_ONLY: "${UPLOAD_PROXY_ONLY:-false}"
      S3_NATIVE_DOWNLOAD: "${S3_NATIVE_DOWNLOAD:-true}"
      GCS_NATIVE_LIST: "${GCS_NATIVE_LIST:-true}"
      AZURE_NATIVE_LIST: "${AZURE_NATIVE_LIST:-true}"
      OCI_NATIVE_LIST: "${OCI_NATIVE_LIST:-true}"
      DOWNLOAD_MAX_CONCURRENT_REQUESTS: "${DOWNLOAD_MAX_CONCURRENT_REQUESTS:-8}"
      DOWNLOAD_MAX_CONCURRENT_PER_PROFILE: "${DOWNLOAD_MAX_CONCURRENT_PER_PROFILE:-4}"
      JOB_QUEUE_CAPACITY: "20"
      OBJECT_INDEX_MAX_OBJECTS: "${OBJECT_INDEX_MAX_OBJECTS:-100000}"
      OBJECT_INDEX_MAX_DURATION: "${OBJECT_INDEX_MAX_DURATION:-15m}"
      RCLONE_RETRY_ATTEMPTS: "3"
      RCLONE_RETRY_BASE_DELAY: "800ms"
      RCLONE_RETRY_MAX_DELAY: "8s"
      RCLONE_RETRY_JITTER_RATIO: "0.2"
    volumes:
      - s3desk-data:/data

volumes:
  s3desk-data:
  s3desk-postgres:
